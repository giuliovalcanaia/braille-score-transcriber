name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # PASSO ADICIONADO: Instalando o Liblouis no Ubuntu do GitHub Actions
      - name: Install liblouis
        run: |
          sudo apt-get update
          sudo apt-get install -y liblouis-dev liblouis-data

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        run: ./gradlew test